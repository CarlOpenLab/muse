<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muse Canvas PoC</title>
  <script type="module" crossorigin src="/assets/poc-CSSqB5-J.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/shell-Pn0O5wqn.js">
  <link rel="stylesheet" crossorigin href="/assets/shell-DpvXOP_2.css">
</head>
<body>
  <header class="shell-head">
    <div class="shell-brand">
      <strong>MUSE</strong>
      <span id="brandEditor" class="mono">…</span>
    </div>
    <nav class="shell-nav mono">
      <a href="?editor=milkdown&harness=1" data-ed="milkdown">MILKDOWN 画布</a>
      <a href="?editor=vditor&harness=1" data-ed="vditor">VDITOR 画布</a>
      <a href="?editor=milkdown&selftest=1" data-st="1">自测往返</a>
    </nav>
  </header>

  <main class="shell-main">
    <section class="shell-canvas-wrap">
      <div class="canvas-chrome">
        <span class="tl"></span><span class="tl"></span><span class="tl"></span>
        <span class="mono canvas-chrome__title" id="chromeTitle">~/Documents/缪斯笔记.md</span>
        <span class="mono canvas-chrome__badge">CANVAS ONLY</span>
      </div>
      <div id="canvas" class="shell-canvas"></div>
      <div class="mono shell-status" id="statusbar">…</div>
    </section>

    <aside class="shell-sim" id="simPanel" hidden>
      <div class="sim-head mono">NATIVE SIM · 模拟 Go 宿主</div>
      <div class="mono sim-state" id="simState">…</div>
      <div class="sim-actions" id="simActions"></div>
      <div class="sim-log mono" id="simLog" aria-live="polite"></div>
    </aside>
  </main>

  <div id="selftest"></div>

</body>
</html>
