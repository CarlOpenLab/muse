appId: com.earendil.muse
productName: Muse
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
# 应用图标：resources/ 下统一维护，mac 用 .icns，win/linux 用 png（构建时自动转换）
icon: icon.png
mac:
  icon: icon.icns
  category: public.app-category.productivity
  # 覆盖默认名称，确保 Dock 悬停、强制退出、关于面板都显示 Muse 而非 Electron
  extendInfo:
    CFBundleName: Muse
    CFBundleDisplayName: Muse
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown Document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - net.daringfireball.markdown
          - public.plain-text
          - public.text
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
