name: Release Muse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            output: Muse
            goos: darwin
            goarch: arm64
          - os: windows-latest
            artifact: windows
            output: Muse.exe
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            artifact: linux
            output: Muse-linux
            goos: linux
            goarch: amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Format check
        working-directory: native
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: native
        run: go vet ./...

      - name: Test
        working-directory: native
        run: go test ./...

      - name: Build native binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p out
          go build -C native -o "../out/${{ matrix.output }}" .

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          brew install create-dmg || true
          chmod +x scripts/build-macos-app.sh
          scripts/build-macos-app.sh "out/${{ matrix.output }}" "resources/icon.icns" "${RELEASE_TAG#v}"

      - name: Upload binary
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-release
          path: out/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/Muse-*-macOS.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Muse ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
