name: Release Muse app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish from the selected branch/tag (must match package.json version)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            output: Muse
            target: darwin-arm64
          - os: windows-latest
            artifact: windows
            output: Muse.exe
            target: windows-amd64
          - os: ubuntu-latest
            artifact: linux
            output: Muse-linux
            target: linux-amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Build the triggering commit so manual runs include fixes from the selected ref.
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.RELEASE_TAG; const expected='v'+pkg.version; if (tag !== expected) { console.error('Release tag '+tag+' does not match package.json version '+pkg.version); process.exit(1); }"

      - name: Build frontend
        run: pnpm run build:web

      - name: Typecheck frontend
        run: pnpm run typecheck

      - name: Lint (gofmt)
        working-directory: native
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: native
        run: go vet ./...

      - name: Test native services
        working-directory: native
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.artifact == 'macos' && 'darwin' || matrix.artifact }}
          GOARCH: ${{ matrix.artifact == 'macos' && 'arm64' || 'amd64' }}
        run: node scripts/build-native.mjs ${{ matrix.output }}

      - name: Compress with UPX (Linux/Windows)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y upx-ucl
          else
            choco install upx -y --no-progress || true
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          fi
          if command -v upx >/dev/null 2>&1; then
            upx --best --lzma "native/${{ matrix.output }}"
          else
            echo "UPX not available, skipping compression"
          fi

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          # 安装 create-dmg（比裸 hdiutil 好看得多）
          brew install create-dmg || true
          chmod +x scripts/build-macos-app.sh
          scripts/build-macos-app.sh "native/${{ matrix.output }}" "resources/icon.icns" "${RELEASE_TAG#v}"

      - name: Sign automatic update
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            node scripts/package-update.mjs dist/stage Muse.app "${{ matrix.target }}"
          else
            node scripts/package-update.mjs native "${{ matrix.output }}" "${{ matrix.target }}"
          fi

      - name: Upload signed update
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-update
          path: |
            dist/Muse-*.tar.gz
            dist/update-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload binary (Linux/Windows)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-release
          path: native/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload DMG (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/Muse-*-macOS.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Muse ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
