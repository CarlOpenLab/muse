name: Release Muse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            goos: darwin
            goarch: arm64
          - os: windows-latest
            artifact: windows
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            artifact: linux
            goos: linux
            goarch: amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # TCC 授权（文件与文件夹、屏幕录制、辅助功能）绑定在 App 的代码签名上。
      # ad-hoc 签名每次发版 cdhash 都会变，用户更新后旧授权匹配不上，只能重新
      # 授权；用同一张 Apple Development 证书签名后，designated requirement
      # 跨版本不变，授权就能一直沿用。mygo build 自己做 .app bundle、DMG 与
      # Windows/Linux 安装包，这一段只负责把证书导进 CI 的钥匙串。
      - name: Import the macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE" || { echo "缺少 MACOS_CERTIFICATE secret"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Apple Development: .*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "证书中没有 Apple Development 身份"; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MACOS_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && env.MACOS_SIGNING_IDENTITY || '' }}
        run: |
          args=(-platform "${{ matrix.goos }}/${{ matrix.goarch }}" -skip-notarize)
          # Windows 安装器需要 NSIS（makensis），runner 上默认没有：
          # 出 exe 与资源，安装器留空。
          if [ "${{ matrix.goos }}" = windows ]; then
            args+=(-skip-installer)
          fi
          if [ "${{ matrix.os }}" = macos-latest ] && [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            args+=(-sign "$MACOS_SIGNING_IDENTITY")
          fi
          go tool mygo build "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-release
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Muse ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          make_latest: true
          # `*` 不跨目录分隔符：merge-multiple 把三个平台下到同一个
          # release-assets/ 之后，这里每个平台各占一个子目录
          # （darwin-arm64/、windows-amd64/、linux-amd64/），`*`
          # 只匹配到这三个目录本身。action 再把 glob 结果用 isFile() 过滤
          # 一遍，目录全部落空，release 于是发成一个空壳——v0.4.0 就是
          # 这样发出去的。`**/*` 才一层层穿到文件。
          files: release-assets/**/*
          fail_on_unmatched_files: true
