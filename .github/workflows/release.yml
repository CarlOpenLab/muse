name: Release Muse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 三个平台共用同一个草稿 release：mygo 的第一个构建创建它，后两个
      # 复用并上传自己的文件。并行跑会在创建草稿时互相踩。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # tag、mygo.json 与更新 manifest 的版本必须一致：发出去的安装包、
      # update-<target>.json 和 release 标题都从这三处来。
      - name: Check the tag matches mygo.json
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: test "v$(jq -r .version mygo.json)" = "$TAG"

      # TCC 授权（文件与文件夹、屏幕录制、辅助功能）绑定在 App 的代码签名上。
      # ad-hoc 签名每次发版 cdhash 都会变，用户更新后旧授权匹配不上，只能重新
      # 授权；用同一张 Apple Development 证书签名后，designated requirement
      # 跨版本不变，授权就能一直沿用。mygo build 自己做 .app bundle、DMG 与
      # Windows/Linux 安装包，这一段只负责把证书导进 CI 的钥匙串。
      - name: Import the macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE" || { echo "缺少 MACOS_CERTIFICATE secret"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Apple Development: .*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "证书中没有 Apple Development 身份"; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # -upload 让 mygo 建/复用草稿 release，挂上安装包、签名更新归档、
      # update-<target>.json 与 SHA256SUMS。私钥缺失时 mygo 直接报错，
      # 不会悄悄发一版装不上的更新。
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MACOS_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && env.MACOS_SIGNING_IDENTITY || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(-platform "${{ matrix.goos }}/${{ matrix.goarch }}" -skip-notarize)
          # Windows 安装器需要 NSIS（makensis），runner 上默认没有：
          # 出 exe 与资源，安装器留空。
          if [ "${{ matrix.goos }}" = windows ]; then
            args+=(-skip-installer)
          fi
          if [ "${{ matrix.os }}" = macos-latest ] && [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            args+=(-sign "$MACOS_SIGNING_IDENTITY")
          fi
          go tool mygo build "${args[@]}" -upload

      # 裸 Muse.exe 是 Windows 用户的便携安装包，也是更新归档替换的入口；
      # mygo 的 -skip-installer 构建只产出它，单独挂上 release。
      - name: Upload the portable Windows build
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: gh release upload "$TAG" dist/windows-amd64/Muse.exe --repo CarlOpenLab/muse --clobber

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 三个平台都上传完才走到这里：草稿转为正式 release。notes 由 mygo
      # 在创建草稿时按 CHANGELOG 写好；这里统一标题、取消草稿并设为
      # latest，下一版的 manifest 才找得到它。
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: gh release edit "$TAG" --repo CarlOpenLab/muse --draft=false --title "Muse $TAG" --latest
